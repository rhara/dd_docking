[project]
name = "dd_docking"
version = "0.1.0"
description = "Ensemble docking toolkit with flexible-side-chain sampling and MD-based induced-fit rescoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "rdkit", "numpy", "pandas",
    "vina", "meeko", "pdbfixer", "openmm", "openmmforcefields", "openff-toolkit", "mdtraj",
]

[project.scripts]
dd_docking-prep = "dd_docking.cli:main_prep"
dd_docking-dock = "dd_docking.cli:main_dock"
dd_docking-refine = "dd_docking.cli:main_refine"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dd_docking"]
